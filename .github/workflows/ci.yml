name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Format, typecheck, unit tests, build
        run: npm run check

  mqtt-smoke:
    # Publishes one fleet tick to a throwaway local Mosquitto and checks a subscriber received all three devices.
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Build tests
        run: dotnet build tests/Meterbench.Tests -c Release

      - name: Start Mosquitto and a subscriber
        run: |
          docker run -d --name mosquitto -p 127.0.0.1:1883:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
          for i in $(seq 1 30); do
            docker exec mosquitto mosquitto_sub -h localhost -t '$SYS/broker/version' -C 1 -W 1 >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mosquitto sh -c "mosquitto_sub -h localhost -t 'meterbench/+/latest' -v -C 3 -W 60 > /tmp/received.txt" &
          sleep 2

      - name: Publish one tick
        env:
          MQTT_SMOKE_BROKER: 127.0.0.1:1883
        run: dotnet test tests/Meterbench.Tests -c Release --no-build --filter "Category=MqttSmoke"

      - name: Check the subscriber got every device
        run: |
          for i in $(seq 1 20); do
            [ "$(docker exec mosquitto sh -c 'wc -l < /tmp/received.txt')" -ge 3 ] && break
            sleep 1
          done
          docker exec mosquitto cat /tmp/received.txt | tee received.txt
          grep -q '^meterbench/MTR-A1/latest {"deviceId":"MTR-A1","tick":5' received.txt
          grep -q '^meterbench/MTR-A2/latest {"deviceId":"MTR-A2","tick":5' received.txt
          grep -q '^meterbench/LC-B1/latest {"deviceId":"LC-B1","tick":5' received.txt
          grep -q '"quantity":"cabinetTemperature","unit":"[^"]*","value":41' received.txt

      - name: Stop Mosquitto
        if: always()
        run: docker rm -f mosquitto

  e2e:
    # Browser check of the dashboard against the real API; screenshots are uploaded as an artifact.
    runs-on: ubuntu-latest
    needs: [build-test, web]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NG_CLI_ANALYTICS: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build API
        working-directory: .
        run: dotnet build src/Meterbench.Api

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e
        run: npx playwright test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-screenshots
          path: |
            web/e2e/screenshots/
            web/e2e/report/
            web/e2e/test-results/
          if-no-files-found: warn
          retention-days: 14
